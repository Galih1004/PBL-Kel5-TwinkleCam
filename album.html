<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Album | Twinkle Cam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">
    <script>
        /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
        try { document.documentElement.dataset.theme = localStorage.getItem("twinkle_theme") || "dark"; }
        catch { document.documentElement.dataset.theme = "dark"; }
    </script>
</head>
<body>
    <header class="header" id="site-header"></header>

    <main class="page">
        <h1 class="page__title">Riwayat Album</h1>
        <p class="page__lead">Strip foto yang kamu simpan tersimpan di browser ini.</p>
        <div class="album-grid" id="albumGrid"></div>
        <div class="empty" id="empty" hidden>
            <p>Belum ada foto tersimpan.</p>
            <a href="photobooth.html" class="btn btn--cta">Mulai foto sekarang</a>
        </div>
        <dialog class="lightbox" id="lightbox">
            <img id="lbImg" alt="Strip foto">
            <div class="booth__controls">
                <a class="btn btn--cta" id="lbDownload" download="twinkle-cam.jpg">Unduh</a>
                <button class="btn btn--outline" id="lbDelete" type="button">Hapus</button>
                <button class="btn btn--outline" id="lbClose" type="button">Tutup</button>
            </div>
        </dialog>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/album.js"></script>
</body>
</html>
