<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates | Twinkle Cam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">
    <script>
        /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
        try { document.documentElement.dataset.theme = localStorage.getItem("twinkle_theme") || "dark"; }
        catch { document.documentElement.dataset.theme = "dark"; }
    </script>
</head>
<body>
    <header class="header" id="site-header"></header>

    <main class="page">
        <h1 class="page__title">Templates</h1>
        <p class="page__lead">Pilih frame untuk strip fotomu. Kamu masih bisa menggantinya saat memotret.</p>
        <div class="tpl-grid" id="tplGrid"></div>
    </main>
    <footer class="footer" id="site-footer"></footer>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/templates.js"></script>
</body>
</html>
