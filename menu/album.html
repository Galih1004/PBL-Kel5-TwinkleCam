<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Riwayat Album | Twinkle Cam</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/pages.css" />
        <link rel="manifest" href="../manifest.webmanifest" />
        <link rel="icon" href="../assets/images/logo.jpg" type="image/jpeg" />
        <script>
            /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
            try {
                document.documentElement.dataset.theme = localStorage.getItem("twinkle_theme") || "dark";
            } catch {
                document.documentElement.dataset.theme = "dark";
            }
        </script>
    </head>
    <body data-root="../">
        <header class="header" id="site-header"></header>

        <!-- ISI: Riwayat Album. Khusus login (guest melihat panel #locked). Daftar #albumGrid dibuat album.js dari IndexedDB. -->
        
<main class="page">
            <h1 class="page__title">Riwayat Album</h1>
            <p class="page__lead">Foto dan live photo yang kamu simpan tersimpan di browser ini.</p>
            <!-- PANEL TERKUNCI: tampil kalau belum login -->
            
<section class="locked" id="locked" hidden>
                <div class="locked__icon" aria-hidden="true">🔒</div>
                <h2>Fitur ini khusus pengguna login</h2>
                <p>Anda harus login terlebih dahulu untuk melihat fitur ini</p>
                <a class="btn btn--cta" href="../akun/login.html?next=album">Login / Sign Up</a>
            </section>
            <div class="album-grid" id="albumGrid"></div>
            <div class="empty" id="empty" hidden>
                <p>Belum ada foto tersimpan.</p>
                <a href="photobooth.html" class="btn btn--cta">Mulai foto sekarang</a>
            </div>
            <!-- PENAMPIL HASIL: tab Foto/Video/GIF (#vTabs), unduh (#vSave), hapus (#vDel). Logika di album.js -->
            
<dialog class="lightbox" id="viewer" aria-label="Lihat hasil">
                <div class="seg" id="vTabs" hidden></div>
                <img id="vImg" alt="Hasil dari album" /><video id="vVid" controls loop playsinline hidden></video>
                <div class="booth__controls">
                    <button class="btn btn--cta" id="vSave" type="button">Unduh</button>
                    <button class="btn btn--outline" id="vDel" type="button">Hapus</button>
                    <button class="btn btn--outline" id="vClose" type="button">Tutup</button>
                </div>
            </dialog>
        </main>
        <footer class="footer" id="site-footer"></footer>
        <script src="../assets/js/layout.js"></script>
        <script src="../assets/js/albumdb.js"></script>
        <script src="../assets/js/album.js"></script>
    </body>
</html>
