<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Templates | Twinkle Cam</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pacifico&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/pages.css" />
        <link rel="manifest" href="../manifest.webmanifest" />
        <link rel="icon" href="../assets/images/logo.jpg" type="image/jpeg" />
        <script>
            /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
            try {
                document.documentElement.dataset.theme = localStorage.getItem("twinkle_theme") || "dark";
            } catch {
                document.documentElement.dataset.theme = "dark";
            }
        </script>
    </head>
    <body data-root="../">
        <header class="header" id="site-header"></header>

        <!-- ISI: katalog template. Semua kartu dibuat assets/js/templates.js.
             Data: template-images.js (template gambar, strip 2x1/3x1/4x1, semua landscape) dan frames-data.js (bingkai polos untuk 1x1, 2x2, 3x2, 4x2).
             Tombol "Pakai template" membuka photobooth.html?template=ID (&grid=KUNCI untuk bingkai polos) -->
        <main class="page">
            <h1 class="page__title">Templates</h1>
            <p class="page__lead">
                Pilih frame untuk fotomu berdasarkan ukuran. Kamu masih bisa menggantinya saat memotret.
            </p>
            <div class="chips" id="tiFilter" role="group" aria-label="Filter ukuran bingkai"></div>
            <p class="muted" id="tiNote"></p>
            <div class="tpl-grid tpl-grid--img" id="tiGrid"></div>
        </main>
        <footer class="footer" id="site-footer"></footer>
        <script src="../assets/js/layout.js"></script>
        <script src="../assets/js/template-images.js"></script>
        <script src="../assets/js/frames-data.js"></script>
        <script src="../assets/js/templates.js"></script>
    </body>
</html>
